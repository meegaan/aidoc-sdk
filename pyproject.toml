[project]
name = "aidoc-sdk"
version = "1.0.0"
description = "AI-native deterministic document canonicalization SDK"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Meegaan Consulting" }
]
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.0"
]

[project.optional-dependencies]
cli = [
    "click>=8.0"
]
docx = [
    "python-docx>=1.2.0"
]
pdf = [
    "pdfplumber>=0.10"
]
dev = [
    "pytest>=9.0.2",
    "mypy>=1.8.0"
]
docs = [
    "mkdocs-material>=9.0.0"
]

[project.scripts]
aidoc = "aidoc_sdk.interfaces.cli:main"

[tool.setuptools.package-data]
aidoc_sdk = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]